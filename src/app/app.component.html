<main class="mx-auto min-h-screen max-w-md bg-white pb-24 shadow-sm">
  <header class="flex items-center justify-between px-5 py-5"><div><p class="text-xs font-semibold uppercase tracking-[.2em] text-mint">Kody</p><h1 class="text-xl font-bold">{{ tab() === 'search' ? 'Consultar precio' : 'Nuevo producto' }}</h1></div><span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-mint">● Local</span></header>
  <p *ngIf="message" class="mx-5 mb-3 rounded-xl bg-amber-50 px-4 py-3 text-sm text-amber-800">{{message}}</p>
  <div *ngIf="scanning" class="mx-5 mb-4 overflow-hidden rounded-2xl bg-black"><video id="scanner-video" muted playsinline class="aspect-video w-full object-cover"></video><p class="p-3 text-center text-sm font-semibold text-white">Apunta la cámara al código de barras</p></div>

  <section *ngIf="tab() === 'search'" class="px-5">
    <button (click)="scan('search')" class="mb-5 flex w-full items-center justify-center gap-3 rounded-3xl bg-ink px-5 py-7 text-lg font-bold text-white shadow-lg"><span class="rounded-full bg-white/15 px-3 py-2 text-2xl">⌁</span> Escanear código</button>
    <div class="flex rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3"><span class="mr-3 text-slate-400">⌕</span><input [(ngModel)]="query" (ngModelChange)="find()" placeholder="Buscar por nombre o código" class="w-full bg-transparent text-sm outline-none" /></div>
    <div *ngIf="results.length" class="mt-4 space-y-2"><button *ngFor="let product of results" (click)="lookup(product.barcode)" class="flex w-full items-center justify-between rounded-2xl border p-4 text-left"><span><b class="block">{{product.name}}</b><small class="text-slate-500">{{product.barcode}}</small></span><b>S/ {{product.price | number:'1.2-2'}}</b></button></div>
    <article *ngIf="selected" class="mt-5 overflow-hidden rounded-3xl bg-emerald-50 p-5"><div class="flex justify-between"><div><p class="text-xs font-bold uppercase text-mint">Producto encontrado</p><h2 class="mt-1 text-xl font-bold">{{selected.name}}</h2></div><p class="text-2xl font-black">S/ {{selected.price | number:'1.2-2'}}</p></div><div class="mt-4 flex gap-2"><span *ngFor="let tag of selected.tags" class="rounded-full bg-white px-3 py-1 text-xs font-semibold">{{tag}}</span><span class="rounded-full bg-white px-3 py-1 text-xs">Stock: {{selected.stock ?? '—'}}</span></div></article>
    <section class="mt-7"><h2 class="mb-3 text-sm font-bold">Consultados recientemente</h2><div class="grid grid-cols-1 gap-2"><button *ngFor="let product of recent" (click)="lookup(product.barcode)" class="flex justify-between rounded-xl bg-slate-50 p-3 text-left text-sm"><span>{{product.name}}</span><b>S/ {{product.price | number:'1.2-2'}}</b></button></div></section>
  </section>

  <form *ngIf="tab() === 'register'" (ngSubmit)="save()" class="space-y-4 px-5"><button type="button" (click)="scan('register')" class="w-full rounded-2xl border-2 border-dashed border-mint bg-emerald-50 py-4 font-bold text-mint">⌁ Leer código de barras</button><label class="block text-sm font-semibold">Código<input [(ngModel)]="draft.barcode" name="barcode" inputmode="numeric" class="mt-1 w-full rounded-xl border p-3 font-normal" /></label><label class="block text-sm font-semibold">Nombre<input [(ngModel)]="draft.name" name="name" class="mt-1 w-full rounded-xl border p-3 font-normal" /></label><div class="grid grid-cols-2 gap-3"><label class="text-sm font-semibold">Precio (S/)<input [(ngModel)]="draft.price" name="price" type="number" step="0.01" class="mt-1 w-full rounded-xl border p-3 font-normal" /></label><label class="text-sm font-semibold">Stock<input [(ngModel)]="draft.stock" name="stock" type="number" class="mt-1 w-full rounded-xl border p-3 font-normal" /></label></div><label class="block text-sm font-semibold">Etiquetas <small class="font-normal text-slate-400">separadas por Enter</small><input #tags (keyup.enter)="draft.tags.push(tags.value);tags.value=''" class="mt-1 w-full rounded-xl border p-3 font-normal" /></label><div *ngIf="draft.tags.length" class="flex flex-wrap gap-2"><span *ngFor="let tag of draft.tags" class="rounded-full bg-emerald-50 px-3 py-1 text-xs">{{tag}}</span></div><label class="block rounded-2xl border border-dashed p-4 text-center text-sm text-slate-500">Adjuntar foto<input type="file" accept="image/*" capture="environment" (change)="onImage($event)" class="mt-2 block w-full text-xs" /></label><button class="w-full rounded-2xl bg-mint py-4 font-bold text-white">Guardar producto</button></form>

  <nav class="fixed bottom-0 left-1/2 flex w-full max-w-md -translate-x-1/2 items-center justify-around border-t bg-white px-4 py-3"><button (click)="tab.set('search')" [class.text-mint]="tab()==='search'" class="font-semibold">⌕ Consultar</button><button (click)="tab.set('register')" [class.text-mint]="tab()==='register'" class="font-semibold">＋ Registrar</button></nav>
</main>
